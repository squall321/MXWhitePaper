name: OWASP ZAP baseline

on:
  pull_request:
  workflow_dispatch:

jobs:
  baseline:
    name: ZAP baseline scan (Apptainer stack)
    # Recommend a self-hosted Linux runner with apptainer pre-installed.
    # The block below installs it on a stock ubuntu runner as a fallback.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Apptainer
        run: |
          ver=1.3.6
          wget -q "https://github.com/apptainer/apptainer/releases/download/v${ver}/apptainer_${ver}_amd64.deb"
          sudo apt-get update
          sudo apt-get install -y ./apptainer_${ver}_amd64.deb

      - name: Bring up MXWP stack
        run: |
          cp .env.example .env
          make build
          make up
          # wait for api healthz
          for i in {1..40}; do
            if curl -fsS http://localhost:8000/api/v1/healthz; then break; fi
            sleep 3
          done

      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000/api/v1/healthz'
          fail_action: true
          allow_issue_writing: false

      - name: Tear down
        if: always()
        run: make down || true

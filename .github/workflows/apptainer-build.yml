name: Apptainer build (.sif)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build .sif (${{ matrix.image }})
    # GitHub-hosted ubuntu does not ship apptainer; we install it on the runner.
    # If the org has self-hosted Linux runners with apptainer, prefer those:
    #   runs-on: [self-hosted, linux, apptainer]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            def: infra/apptainer/api.def
          - image: web
            def: infra/apptainer/web.def
    steps:
      - uses: actions/checkout@v4

      - name: Install Apptainer
        run: |
          # Official binary release; pin a known-good version.
          ver=1.3.6
          wget -q "https://github.com/apptainer/apptainer/releases/download/v${ver}/apptainer_${ver}_amd64.deb"
          sudo apt-get update
          sudo apt-get install -y ./apptainer_${ver}_amd64.deb
          apptainer --version

      - name: Build ${{ matrix.image }}.sif
        run: |
          apptainer build --force "infra/apptainer/${{ matrix.image }}.sif" "${{ matrix.def }}"

      - name: Upload .sif artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-sif-${{ github.sha }}
          path: infra/apptainer/${{ matrix.image }}.sif
          retention-days: 14

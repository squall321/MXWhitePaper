name: llm-docx-toolkit

# Builds three standalone binaries for Linux + Windows on every push to main
# and on tagged releases:
#   - mxwp-validator : .docx → DocumentJSON validator
#   - mxwp-rules     : RAG CLI (query / index / check)
#   - mxwp-mcp       : MCP stdio server
#
# Also enforces Layer 1 of the 4-layer RAG sync guarantee: a CI step
# regenerates rag/chunks.jsonl + rag/index.lock and fails the build if the
# regenerated lock differs from what was committed. This means any widget /
# import-rule change forces the contributor to re-run the chunker locally
# and commit the refreshed index, keeping the LLM context in sync.
#
# Artifacts:
#   - llm-docx-toolkit-linux   (all 3 binaries + examples + docs)
#   - llm-docx-toolkit-windows (all 3 binaries + examples + docs)
#
# On a tag push (v*), a GitHub Release is created with both bundles attached.

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/app/services/docx_import.py'
      - 'apps/api/app/services/widget_markers.py'
      - 'packages/shared/schemas/document.json'
      - 'docs/llm-input-rules.md'
      - 'dist/llm-docx-toolkit/**'
      - '.github/workflows/llm-docx-toolkit.yml'
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  # ── Layer 1: RAG index lock verification (Linux-only, fast) ────────
  # Runs once before the build matrix. If it fails, the matrix never starts
  # — saves CI minutes when a contributor forgot to re-run the chunker.
  rag-lock-verify:
    name: rag lock verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh llm-input-rules.md from source
        run: cp docs/llm-input-rules.md dist/llm-docx-toolkit/llm-input-rules.md

      - name: Regenerate chunks + lock
        working-directory: dist/llm-docx-toolkit
        run: |
          python3 rag/chunker.py
          echo "--- regenerated index.lock ---"
          cat rag/index.lock

      - name: Fail if regenerated lock differs from committed one
        run: |
          # chunks.jsonl is deterministic byte-for-byte; index.lock only
          # changes in `generated_at` between runs — compare it with that
          # field stripped via jq so unrelated timestamps don't false-alarm.
          if ! git diff --quiet -- dist/llm-docx-toolkit/rag/chunks.jsonl; then
            echo "✗ RAG chunks drift detected."
            git --no-pager diff -- dist/llm-docx-toolkit/rag/chunks.jsonl | head -80
            echo ""
            echo "Run locally:"
            echo "  python3 dist/llm-docx-toolkit/rag/chunker.py"
            echo "  git add dist/llm-docx-toolkit/rag/index.lock dist/llm-docx-toolkit/rag/chunks.jsonl"
            exit 1
          fi
          jq 'del(.generated_at)' dist/llm-docx-toolkit/rag/index.lock > /tmp/lock.regen.json
          git show HEAD:dist/llm-docx-toolkit/rag/index.lock \
            | jq 'del(.generated_at)' > /tmp/lock.head.json
          if ! diff -q /tmp/lock.head.json /tmp/lock.regen.json >/dev/null; then
            echo "✗ RAG index.lock drift detected (ignoring generated_at)."
            diff /tmp/lock.head.json /tmp/lock.regen.json | head -80
            echo ""
            echo "Run locally:"
            echo "  python3 dist/llm-docx-toolkit/rag/chunker.py"
            echo "  git add dist/llm-docx-toolkit/rag/index.lock dist/llm-docx-toolkit/rag/chunks.jsonl"
            exit 1
          fi
          echo "✓ RAG index lock matches HEAD (ignoring generated_at)."

  # ── Build matrix (Linux + Windows) ─────────────────────────────────
  build:
    name: ${{ matrix.os }}
    needs: rag-lock-verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_tag: linux
            ext: ''
          - os: windows-latest
            platform_tag: windows
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        working-directory: dist/llm-docx-toolkit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh llm-input-rules.md from source
        shell: bash
        run: cp docs/llm-input-rules.md dist/llm-docx-toolkit/llm-input-rules.md

      # The CI-side regenerate has already been done & checked; we just need
      # the artifacts in place for the rules + mcp builds.
      - name: Ensure rag/ index exists
        working-directory: dist/llm-docx-toolkit
        shell: bash
        run: python3 rag/chunker.py

      - name: Run toolkit test suites
        working-directory: dist/llm-docx-toolkit
        shell: bash
        run: |
          # Skip slow ST model download in CI by default; bm25 + openai-mocked
          # cover the surface area we care about for build-time verification.
          python3 -m pytest rag/tests/ mcp/tests/ -v -m "not slow"

      - name: Build all three binaries
        working-directory: dist/llm-docx-toolkit
        shell: bash
        run: |
          set +e
          {
            echo "=== preflight ==="
            python --version
            python -c "import sys; print('exe=', sys.executable)"
            python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"
            python -c "import ulid; print('ulid module=', ulid.__file__)"
            python -c "import jsonschema; print('jsonschema', jsonschema.__version__)"
            python -c "import mcp; print('mcp', mcp.__version__ if hasattr(mcp, '__version__') else '?')"
            python -c "import numpy; print('numpy', numpy.__version__)"
            echo "=== folder listing ==="
            ls -la
            echo "=== build.py --target all ==="
            python build.py --clean
            echo "=== exit: $? ==="
          } 2>&1 | tee build.log
          BUILD_EC=${PIPESTATUS[0]}
          echo "build pipeline exit code: $BUILD_EC"
          exit $BUILD_EC

      - name: Upload build log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform_tag }}
          path: dist/llm-docx-toolkit/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Build example .docx files
        working-directory: dist/llm-docx-toolkit
        run: |
          pip install python-docx
          python examples/build_examples.py

      - name: Smoke test — validator on all 3 examples
        shell: bash
        working-directory: dist/llm-docx-toolkit
        run: |
          BIN="bin/mxwp-validator-${{ matrix.platform_tag == 'linux' && 'linux' || 'win32' }}${{ matrix.ext }}"
          chmod +x "$BIN" 2>/dev/null || true
          set -e
          for f in examples/good-example.docx examples/all-widgets.docx examples/bad-example.docx; do
            echo "--- $f ---"
            "$BIN" "$f" || code=$?
            echo "exit=$code"
          done
          for f in examples/good-example.docx examples/all-widgets.docx examples/bad-example.docx; do
            test -s "${f%.docx}.json" || { echo "missing JSON dump for $f"; exit 1; }
          done

      - name: Smoke test — mxwp-rules query + check
        shell: bash
        working-directory: dist/llm-docx-toolkit
        run: |
          BIN="bin/mxwp-rules-${{ matrix.platform_tag == 'linux' && 'linux' || 'win32' }}${{ matrix.ext }}"
          chmod +x "$BIN" 2>/dev/null || true
          set -e
          "$BIN" --version
          # bm25 has no external deps and ships with the binary's data files,
          # so we can run a real query without hitting the network.
          "$BIN" index --backend bm25 --rebuild
          "$BIN" query --backend bm25 "차트"
          "$BIN" check

      - name: Smoke test — mxwp-mcp launches
        shell: bash
        working-directory: dist/llm-docx-toolkit
        run: |
          BIN="bin/mxwp-mcp-${{ matrix.platform_tag == 'linux' && 'linux' || 'win32' }}${{ matrix.ext }}"
          chmod +x "$BIN" 2>/dev/null || true
          set -e
          "$BIN" --version

      - name: Stage release bundle
        shell: bash
        working-directory: dist/llm-docx-toolkit
        run: |
          BUNDLE="llm-docx-toolkit-${{ matrix.platform_tag }}"
          rm -rf "_release/${BUNDLE}"
          mkdir -p "_release/${BUNDLE}"
          cp -r bin "_release/${BUNDLE}/bin"
          cp -r examples "_release/${BUNDLE}/examples"
          cp -r src "_release/${BUNDLE}/src"
          cp -r rag "_release/${BUNDLE}/rag"
          cp -r mcp "_release/${BUNDLE}/mcp"
          cp README.md llm-input-rules.md llm-system-prompt.md requirements.txt build.py "_release/${BUNDLE}/"
          if [ -d "apply" ]; then
            cp -r apply "_release/${BUNDLE}/apply"
          fi
          # Strip pyc + caches before zipping.
          find "_release/${BUNDLE}" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "_release/${BUNDLE}" -type d -name '.pytest_cache' -prune -exec rm -rf {} +

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-docx-toolkit-${{ matrix.platform_tag }}
          path: dist/llm-docx-toolkit/_release/llm-docx-toolkit-${{ matrix.platform_tag }}
          retention-days: 30

      - name: Pack release archive (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: dist/llm-docx-toolkit/_release
        run: |
          BUNDLE="llm-docx-toolkit-${{ matrix.platform_tag }}"
          if [ "${{ matrix.platform_tag }}" = "windows" ]; then
            python -c "import shutil; shutil.make_archive('${BUNDLE}', 'zip', '${BUNDLE}')"
          else
            tar -czf "${BUNDLE}.tar.gz" "${BUNDLE}"
          fi
          ls -l

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/llm-docx-toolkit/_release/llm-docx-toolkit-${{ matrix.platform_tag }}.tar.gz
            dist/llm-docx-toolkit/_release/llm-docx-toolkit-${{ matrix.platform_tag }}.zip
          fail_on_unmatched_files: false

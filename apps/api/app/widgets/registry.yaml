# MX White Paper — Widget Catalog
# DocumentJSON v1.0 의 data-source block 이 참조하는 widget 정의.
# 모든 위젯은 alembic 0040 fact tables (sales_daily / region_metrics /
# kpi_snapshots) 에서 실시간 SQL 로 데이터를 조회한다. 하드코딩 mock 없음.
#
# 새 위젯 추가:
#   1) 이 파일에 entry 추가
#   2) app/routers/widgets.py 에 handler 라우트 추가 (또는 generic kpi/{key} 사용)
#   3) seed_widget_facts.py 에 데이터 추가 (필요 시)
widgets:
  # ── KPI snapshots ────────────────────────────────────────────────
  - id: kpi.finance-daily
    name: 재무 일일 KPI
    endpoint: /api/v1/widgets/kpi-finance-daily-summary
    render: kpi-cards
    refreshInterval: 300
    description: 재무팀 일일 매출/지출 — kpi_snapshots 의 finance.daily.* 키 2개.

  - id: kpi.month-end-progress
    name: 월결산 진행률 KPI
    endpoint: /api/v1/widgets/kpi/finance.month-end-progress.percent
    render: kpi-cards
    refreshInterval: 600
    description: kpi_snapshots 의 finance.month-end-progress.percent 단일 카드.

  - id: kpi.q1-2026-total
    name: Q1 2026 매출 누적
    endpoint: /api/v1/widgets/kpi/sales.q1-2026.total
    render: kpi-cards
    refreshInterval: 600
    description: kpi_snapshots 의 sales.q1-2026.total 단일 카드.

  # ── Chart widgets ────────────────────────────────────────────────
  - id: chart.sales-trend
    name: 매출 트렌드 (최근 N일)
    endpoint: /api/v1/widgets/chart/sales-trend
    render: chart
    refreshInterval: 300
    params:
      - name: team
        kind: string
        default: finance
      - name: days
        kind: integer
        default: 30
    description: sales_daily 의 revenue/expense 일별 시계열.

  - id: chart.month-end-progress
    name: 월결산 5단계 진행률
    endpoint: /api/v1/widgets/chart/month-end-progress
    render: chart
    refreshInterval: 600
    description: kpi_snapshots 기준 5단계 (Cutoff / Reconcile / Adjustments / Review / Publish) 진행률.

  # ── Table widgets ────────────────────────────────────────────────
  - id: table.region-breakdown
    name: 지역별 매출 분포
    endpoint: /api/v1/widgets/table/region-breakdown
    render: table
    refreshInterval: 1800
    params:
      - name: period
        kind: string
        default: "2026-Q1"
    description: region_metrics 의 분기별 지역 매출 / QoQ / 비중.

  - id: table.sales-summary
    name: 팀별 매출 합계 (최근 N일)
    endpoint: /api/v1/widgets/table/sales-summary
    render: table
    refreshInterval: 1800
    params:
      - name: days
        kind: integer
        default: 30
    description: sales_daily 를 팀별로 SUM aggregate.

  # ── Launch program widgets (sample 06) ──────────────────────────
  - id: launch.tasks
    name: 출시 Gantt — Tasks
    endpoint: /api/v1/widgets/launch/galaxy-flip-2026/tasks
    render: table
    description: launch_tasks 의 program=galaxy-flip-2026 행. start/end/progress%/owner.

  - id: launch.timeline
    name: 출시 주차별 활동
    endpoint: /api/v1/widgets/launch/galaxy-flip-2026/timeline
    render: table
    description: launch_timeline — 주차/활동/담당/산출물.

  - id: launch.forecast
    name: 수요 시나리오 (baseline/bull/bear)
    endpoint: /api/v1/widgets/launch/galaxy-flip-2026/forecast
    render: chart
    description: demand_forecast 를 분기 x 시나리오 차트로 pivot.

  # ── Full set: analytics + operations (round 6) ───────────────────
  - id: chart.team-share
    name: 팀별 매출 비중 (pie)
    endpoint: /api/v1/widgets/chart/team-share
    render: chart
    refreshInterval: 600
    params:
      - { name: days, kind: integer, default: 30 }
    description: sales_daily 를 팀별 SUM 후 파이.

  - id: chart.region-share
    name: 지역별 매출 비중 (pie)
    endpoint: /api/v1/widgets/chart/region-share
    render: chart
    refreshInterval: 1800
    params:
      - { name: period, kind: string, default: "2026-Q1" }

  - id: chart.cohort-retention
    name: 코호트 잔존율
    endpoint: /api/v1/widgets/chart/cohort-retention
    render: chart
    refreshInterval: 3600
    description: cohort_retention 분기별 잔존 곡선.

  - id: chart.funnel-conversion
    name: 전환 funnel
    endpoint: /api/v1/widgets/chart/funnel-conversion
    render: chart
    params:
      - { name: funnel, kind: string, default: signup }
    description: funnel_metrics 단계별 user count.

  - id: chart.audit-volume
    name: 감사 이벤트 추이
    endpoint: /api/v1/widgets/chart/audit-volume
    render: chart
    refreshInterval: 600
    params:
      - { name: days, kind: integer, default: 30 }

  - id: table.incidents-recent
    name: 최근 운영 인시던트
    endpoint: /api/v1/widgets/table/incidents-recent
    render: table
    refreshInterval: 300

  - id: table.campaigns-active
    name: 진행 중인 마케팅 캠페인
    endpoint: /api/v1/widgets/table/campaigns-active
    render: table

  - id: table.documents-top
    name: 최근 게시된 문서
    endpoint: /api/v1/widgets/table/documents-top
    render: table
    params:
      - { name: limit, kind: integer, default: 10 }

  - id: table.glossary-top
    name: 자주 쓰이는 용어
    endpoint: /api/v1/widgets/table/glossary-top
    render: table
    refreshInterval: 1800

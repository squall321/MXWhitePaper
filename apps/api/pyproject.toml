[project]
name = "mxwp-api"
version = "0.1.0"
description = "MX White Paper — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  # starlette 1.x (fastapi ≥0.128 대) 는 라우터 introspection 을 깨뜨린다 —
  # known-good 으로 핀 고정 (infra/apptainer/api.def 주석 참조).
  "fastapi==0.121.3",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.3",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.18",
  "boto3>=1.35",
  "botocore>=1.35",
  "Pillow>=11.0",
  "meilisearch>=0.31",
  "slowapi>=0.1.9",
  "structlog>=24.4",
  "httpx>=0.28",
  "ulid-py>=1.1",
  # docx import (POST /imports/docx). 우리 파서는 zipfile+ElementTree 로
  # 직접 OOXML/OMML 을 파싱하므로 python-docx 자체에 강결합되진 않지만,
  # 향후 idiomatic 표준화 + sub-dep 호환을 위해 명시적으로 의존성 선언.
  "python-docx>=1.1",
  # pptx export (POST /exports/pptx). pure-python 이라 시스템 라이브러리
  # 의존이 없어 apptainer 환경에서 추가 설정 없이 동작한다 (WeasyPrint 와
  # 달리 cairo/pango 같은 native lib 미요구).
  "python-pptx>=0.6",
  # xlsx import (POST /imports/csv 및 향후 xlsx). api.def 에는 이미 baked 돼
  # 있었으나 metadata 에서는 누락 — transitive 가 아니라 직접 의존이므로 명시화.
  "openpyxl>=3.1",
  # pdf import (POST /imports/pdf). fitz(=pymupdf) 로 페이지/이미지 추출 후
  # 다른 import 와 동일한 DocumentJSON 으로 위젯 autodetect 를 태운다.
  # 컨테이너 설치본 1.27.2.3 기준으로 핀.
  "pymupdf>=1.27,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-postgresql>=6.1",
  "ruff>=0.7",
  "pyright>=1.1.388",
  "datamodel-code-generator>=0.26",
]

[project.scripts]
# 서버사이드 일괄 정규화 CLI — `mxwp-roundtrip --input ... --output ...`
mxwp-roundtrip = "app.cli.roundtrip:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = [
  # Auto-generated by packages/shared/codegen/generate-py.py from the
  # document.json schema. Re-runs every codegen-drift check, so any
  # ruff edit here is lost on the next regen and the CI gate fires.
  "app/schemas/document.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",      # long lines — pyright + editor handle this case-by-case
  # FastAPI dependency injection: Depends(get_db) / Query(...) / File(...)
  # is the canonical pattern and triggers B008 (function-call-in-default-
  # argument). 517 hits across the routers — all intentional.
  "B008",
  # docstrings and Korean comments deliberately mix lookalike unicode
  # (fullwidth punctuation etc.); ambiguous-unicode checks would force
  # ASCII-only and lose information.
  "RUF001", "RUF002", "RUF003",
  # Exception class names without 'Error' suffix are our convention
  # (Unauthorized, Forbidden, NotFound, Conflict match HTTP semantics).
  "N818",
  # SQL / scientific code legitimately uses non-snake_case locals (X, Y,
  # ID, etc). Force-fixing these costs readability without buying safety.
  "N806",
  # SIM family is style preference, not correctness. The codebase uses
  # explicit if/try blocks deliberately (clearer stack traces, easier
  # diff). Don't churn over collapsible-if / contextlib.suppress.
  "SIM102", "SIM103", "SIM105", "SIM108", "SIM110", "SIM118",
  # Async dangling task is intentional for fire-and-forget background
  # work (audit_log writes, search reindex). We keep them un-awaited.
  "RUF006",
  # pytest's `with pytest.raises(Exception):` pattern is intentional in
  # tests that only care that *something* raised (not the precise type).
  "B017",
  # `;`-separated statements in widget_markers.py compact the literal
  # marker-line table for readability — splitting each line to its own
  # statement makes the table harder to scan.
  "E702",
  # B023 is a real correctness footgun in general but the offenders in
  # this codebase are all "build a closure inside a loop and call it
  # synchronously inside the same iteration" — verified safe. Override
  # per-call with `# noqa: B023` if a new instance shows up that isn't.
  "B023",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use ambiguous variable names like `l` for a list
# inside a list comprehension that returns immediately.
"tests/**/*.py" = [
  "E741",
  # Test functions that mirror OpenXML / external API spellings — e.g.
  # `test_emit_marker_for_chart_invalid_chartType_no_variant` keeps the
  # mixed-case chartType from the spec so a grep on chartType still hits.
  "N802",
  # Test files occasionally lazy-import at the bottom for cycle-breaking
  # or symbol re-export.
  "E402",
]
# Conftest / scripts may need imports after sys.path tweaks.
"tests/conftest.py" = ["E402"]
"app/scripts/**/*.py" = ["E402"]
# Runner services do inline lazy imports inside hot loops to avoid
# pulling heavyweight deps at module load (ticker_state). The one-line
# `from X import Y; Y(...)` form is intentional for readability of the
# tick pattern; isort would split it across lines and ruin the visual.
"app/services/audit_pruner.py" = ["I001"]
"app/services/automation_cron.py" = ["I001"]
"app/services/automation_dispatcher.py" = ["I001"]
"app/services/backup_runner.py" = ["I001"]
"app/services/digest_runner.py" = ["I001"]
"app/services/reminder_runner.py" = ["I001"]
"app/services/retention_runner.py" = ["I001"]
# OpenXML wrapper functions mirror the spec's CamelCase tag names so a
# grep on `oMath` / `chartType` lands on the handler.
"app/services/docx_import.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
include = ["app", "tests"]
exclude = [
  "**/__pycache__",
  "**/.venv",
  # Auto-generated from document.json; codegen owns the types.
  "app/schemas/document.py",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Raw-SQL routers pull rows via fetchrow() / .first() which pyright
# correctly types as Row | None. The router contract is "raise NotFound
# at the call site if missing", and pyright can't see through the raise.
# Forcing every subscript through a typed wrapper would be a big rewrite;
# downgrade these to warnings instead so the build doesn't fail on
# patterns that work fine at runtime.
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
# format_pydantic_errors() in core/errors.py takes a Sequence[dict] that
# pyright narrows to Sequence[Any]; same family — not worth a refactor.
reportArgumentType = "warning"
# Result.rowcount is on the actual SQLAlchemy class but the stubs ship
# it on CursorResult, not the generic Result[Any] async wrappers return.
# python-docx / python-pptx / PIL / meilisearch ship incomplete stubs
# that miss things we genuinely use (text_frame, table, LANCZOS, errors).
# Test fixtures with @pytest.fixture wrap yield generators; pyright
# can't see through the decorator.
reportAttributeAccessIssue = "warning"
reportGeneralTypeIssues = "warning"
reportOperatorIssue = "warning"
# pytest fixtures use generator yield syntax but pyright wants explicit
# Generator/AsyncGenerator return annotations. Adding them to every
# fixture is mechanical churn — downgrade so fixture-pattern code passes.
reportInvalidTypeForm = "warning"
# Test fixture functions yielding session/client triggers the generator
# return-type checks above; downgrade those too.
reportReturnType = "warning"

[tool.pytest.ini_options]
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = ["tests"]
# pass-3 N5: IframeBlock 은 RootModel[IframeBlock1 | IframeBlock2] 인데 두 helper
# class 가 공통 discriminator field 가 없어서 pydantic 이 left-to-right union
# serializer 로 fallback → "Pydantic serializer warnings:" UserWarning 이 매
# export 마다 발생. 동작은 정상 (validation + serialise 둘 다 OK). 메시지
# prefix 로 매칭 — 좁게 잡아 다른 경고는 안 죽임.
filterwarnings = [
    "ignore:Pydantic serializer warnings:UserWarning",
]

[project]
name = "mxwp-api"
version = "0.1.0"
description = "MX White Paper — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.3",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.18",
  "boto3>=1.35",
  "botocore>=1.35",
  "Pillow>=11.0",
  "meilisearch>=0.31",
  "slowapi>=0.1.9",
  "structlog>=24.4",
  "httpx>=0.28",
  "ulid-py>=1.1",
  # docx import (POST /imports/docx). 우리 파서는 zipfile+ElementTree 로
  # 직접 OOXML/OMML 을 파싱하므로 python-docx 자체에 강결합되진 않지만,
  # 향후 idiomatic 표준화 + sub-dep 호환을 위해 명시적으로 의존성 선언.
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-postgresql>=6.1",
  "ruff>=0.7",
  "pyright>=1.1.388",
  "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
include = ["app", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = ["tests"]

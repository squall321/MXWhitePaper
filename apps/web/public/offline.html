<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오프라인 — MX White Paper</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        max-width: 480px;
        padding: 32px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        text-align: center;
      }
      h1 { font-size: 18px; margin: 0 0 8px; color: #1428A0; }
      p { margin: 4px 0; color: #475569; }
      button {
        margin-top: 16px;
        padding: 8px 16px;
        background: #1428A0;
        color: #ffffff;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover { background: #0f1f80; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>📡 오프라인입니다</h1>
      <p>네트워크 연결이 끊어져 새 페이지를 불러올 수 없어요.</p>
      <p>최근에 본 문서는 캐시에서 그대로 열 수 있습니다.</p>
      <button onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>

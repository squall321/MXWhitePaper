# MXWhitePaper → AX Hub 동기화 설정
#
# 환경변수 ${VAR} 자동 치환.

aidatahub:
  # 컨테이너간 호출은 "http://aidatahub:8001"
  # 호스트(쉘)에서 직접 실행 시: --aidh-url http://127.0.0.1:8001 로 override.
  base_url: "http://aidatahub:8001"
  api_key: "${AIDH_API_KEY}"
  external_source: "mxwp"

mxwp:
  base_url: "http://mxwp-api:8000"
  api_key: "${MXWP_API_KEY}"
  filter:
    # 'published' 만 동기화 (draft / archived 제외)
    status: "published"

sync:
  # AX Hub 한 호출당 record 수
  batch_size: 50

  # MXWP 목록 페이지 크기 (max 100).
  # a4304ae 에서 offset 페이지네이션 추가 — fetch_all_documents 가
  # next_offset 기반으로 페이지 끝까지 가져옴 (100문서 초과해도 OK).
  page_size: 100

  # 우리 측 throttle (req/s) — list + detail 각각에 적용
  max_rps: 2.0

  # 이미지 처리 정책
  # url_ref          : MinIO presigned URL 을 record_attachments.source_url 에 저장 (빠름, 권장)
  # download_upload  : MinIO 다운 → AX Hub /attachments 로 업로드 (무거움, MXWP 폐기 후에도 보존)
  attachment_mode: "url_ref"

  # DocumentJSON 의 어느 필드를 우리가 보존할지.
  # 주: tags/owners/keywords/division 등은 실제로는 content.metadata 안에 있고,
  # aidatahub_sync._metadata() 가 거기서 읽음. 본 리스트는 참고용 화이트리스트.
  fields_keep:
    - document_id
    - slug
    - title
    - summary
    - status
    - tags
    - owners        # ★ DocumentJSON v1.0 은 "authors" 가 아니라 "owners"
    - keywords
    - version
    - etag
    - created_at
    - updated_at
    - sections
